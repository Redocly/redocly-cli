asyncapi: 3.0.0
info:
  title: Redocly Cafe Accounts
  version: 1.0.0
  description: This service is in charge of processing customer signups for the cafe loyalty program
channels:
  customerSignedUp:
    address: cafe/customers/signedup/
    messages:
      CustomerSignedUp:
        $ref: '#/components/messages/CustomerSignedUp'
operations:
  sendCustomerSignedUp:
    action: send
    channel:
      $ref: '#/channels/customerSignedUp'
    messages:
      - $ref: '#/channels/customerSignedUp/messages/CustomerSignedUp'
components:
  messages:
    CustomerSignedUp:
      payload:
        type: object
        properties:
          customerName:
            type: string
            description: Name of the customer
          email:
            type: string
            format: email
            description: Email of the customer
