arazzo: 1.0.1
info:
  title: Create and read cafe orders
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ./coverage-cafe.yaml

workflows:
  - workflowId: orders
    steps:
      - stepId: create-order
        operationId: createOrder
        parameters:
          - in: header
            name: x-request-id
            value: request-1
        requestBody:
          payload:
            customerName: Jane
            couponCode: SPRING
        successCriteria:
          - condition: $statusCode == 201
      - stepId: create-order-without-a-customer
        operationId: createOrder
        requestBody:
          payload:
            comment: No sugar
        successCriteria:
          - condition: $statusCode == 400
      - stepId: get-unknown-order
        operationId: getOrderById
        parameters:
          - in: path
            name: orderId
            value: ord_unknown
        successCriteria:
          - condition: $statusCode == 404
      - stepId: check-the-cafe-is-open
        x-operation:
          url: https://api.cafe.redocly.com/health
          method: get
        successCriteria:
          - condition: $statusCode == 200
