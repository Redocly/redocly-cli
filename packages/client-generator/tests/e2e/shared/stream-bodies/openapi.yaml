openapi: 3.1.0
info:
  title: Stream bodies
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3115
paths:
  /uploads:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Stored
  /uploads/{name}:
    put:
      operationId: uploadBlob
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Stored
  /fail/{kind}:
    post:
      operationId: uploadFailing
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Never returned, the test server always answers 503
