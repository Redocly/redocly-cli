openapi: 3.1.0
info: { title: Response Headers API, version: 1.0.0 }
servers:
  - { url: https://api.example.com }
paths:
  /customers:
    get:
      operationId: listCustomers
      responses:
        '200':
          description: ok
          headers:
            Pagination-Total:
              required: true
              schema: { $ref: '#/components/schemas/Count' }
            X-Flag:
              schema: { type: boolean }
            3D-Secure:
              required: true
              schema: { type: boolean }
            X-Foo:
              schema: { type: integer }
            X_Foo:
              schema: { type: string }
            X-Ids:
              schema:
                type: array
                items: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Customer' }
  /customers/{id}:
    post:
      operationId: createCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: created
          headers:
            Location:
              required: true
              schema: { type: string }
components:
  schemas:
    Count:
      type: integer
    Customer:
      type: object
      required: [id]
      properties:
        id: { type: string }
