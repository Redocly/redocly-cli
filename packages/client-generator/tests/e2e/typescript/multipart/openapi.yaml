openapi: 3.1.0
info: { title: M, version: 1.0.0 }
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, orgId]
              properties:
                file: { type: string, format: binary }
                orgId: { type: string }
                tags: { type: array, items: { type: string } }
                meta: { type: object }
      responses: { '200': { description: ok } }
