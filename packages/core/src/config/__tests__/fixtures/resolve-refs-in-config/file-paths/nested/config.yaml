api:
  extends:
    - ./api-rules.yaml
  root: ./openapi.yaml
  output: dist/openapi.yaml
  overlays:
    - ./overlays/add-servers.yaml
  clientOutput: ./client.ts
  client:
    $ref: ./deep/config.yaml#/client
    setup: ./setup.mjs
chain:
  $ref: ./deep/config.yaml#/api
untouched:
  root: https://example.com/openapi.yaml
  output: /absolute/dist/openapi.yaml
  clientOutput: ''
client:
  setup: ./setup.mjs
  cliOutput: ./cli/index.ts
  goPackage: ./not-a-path
logo:
  favicon: ./images/favicon.ico
  srcSet: ./images/logo-dark.svg dark, ./images/logo-light.svg light
openapi:
  htmlTemplate: ./template.html
navbar:
  items:
    - page: ./docs/index.md
      icon: ./images/home.svg
    - page: ./docs/guide.md
      icon: home
    - page: ./docs/api.md
      icon:
        srcSet: ./images/api-dark.svg dark, https://cdn.example.com/api-light.svg light
breadcrumbs:
  prefixItems:
    - label: Home
      page: ./docs/index.md
      icon: ./images/crumb.png
    - label: Docs
      icon: book
entitiesCatalog:
  entityTypes:
    service:
      icon:
        src: ./images/service.svg
        srcSet: ./images/service-dark.svg dark, ./images/service-light.svg light
catalog:
  slug: /apis/
  items:
    - directory: ./apis
    - directory: ..
apiFunctions:
  folders:
    - ./functions
    - https://example.com/functions
    - s3://bucket/functions
seo:
  llmstxt:
    excludeFiles:
      - internal/**
      - '!internal/public/**'
      - /root-anchored/**
      - '**/_partials/**'
      - '*.md'
markdown:
  partialsFolders:
    - _partials/**
mcp:
  docs:
    ignore:
      - drafts/*.yaml
scorecard:
  ignore:
    - legacy/openapi.yaml
skills:
  excludeFiles:
    - '{a,b}/**'
