openapi: 3.1.0
info:
  title: Plans API
  version: 1.0.0
paths:
  /plans:
    post:
      summary: Create a plan
      operationId: createPlan
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Plan:
      allOf:
        - type: object
          properties:
            id:
              type: string
        - anyOf:
            - $ref: '#/components/schemas/VariantA'
            - $ref: '#/components/schemas/VariantB'
    VariantA:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [a]
        detail:
          $ref: '#/components/schemas/Nested'
    VariantB:
      type: object
      properties:
        note:
          type: string
    Nested:
      type: object
      properties:
        value:
          type: integer
  responses:
    NotFound:
      description: Plan not found.
