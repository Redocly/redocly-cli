openapi: 3.1.0
info:
  title: Redocly Cafe menu
  version: 1.0.0
  x-prefix: menu
servers:
  - url: https://redocly.com/_mock/demo/openapi/cafe
paths:
  /menu:
    get:
      operationId: listMenuItems
      responses:
        '200':
          description: Menu items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/menu_Item'
components:
  schemas:
    Item:
      description: Name of a menu item.
      type: string
    menu_Item:
      description: A menu item.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Item'
        price:
          $ref: '#/components/schemas/Price'
    Price:
      description: Price in US cents.
      type: integer
