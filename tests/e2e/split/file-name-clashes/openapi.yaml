openapi: 3.1.0
info:
  title: File name clashes
  version: 1.0.0
paths:
  /menu:
    get:
      summary: List menu items
      x-codeSamples:
        - lang: PHP
          label: SDK 1
          source: $client->menu()->list();
        - lang: PHP
          label: SDK 2
          source: $cafe->menu()->list();
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
  /Menu:
    get:
      summary: List menu items (legacy)
      responses:
        '200':
          description: OK
  /menu/items:
    get:
      summary: List menu items (nested)
      responses:
        '200':
          description: OK
  /menu_items:
    get:
      summary: List menu items (flat)
      responses:
        '200':
          description: OK
components:
  schemas:
    MenuItem:
      type: object
