arazzo: 1.0.1
info:
  title: Redocly Cafe API
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml

workflows:
  - workflowId: basic-auth-workflow
    x-security:
      - scheme:
          type: http
          scheme: basic
        values:
          username: John
          password: $inputs.secret
    inputs:
      type: object
      properties:
        secret:
          type: string
          default: some-password
    steps:
      - stepId: step-with-basic-auth-scheme
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
      - stepId: step-with-basic-auth-scheme-2
        operationId: createOrder
        requestBody:
          payload:
            customerName: Mary Ann
            orderItems:
              - menuItemId: prd_0000000000seedtrams0000000
                quantity: 2
                comment: No sugar!
        successCriteria:
          - condition: $statusCode == 401
