arazzo: 1.0.1
info:
  title: Test a step that uses workflowId together with requestBody
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: list-menu
    steps:
      - stepId: list-menu-items
        operationId: cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: list-menu-with-request-body
    steps:
      - stepId: run-list-menu
        workflowId: list-menu
        requestBody:
          payload:
            limit: 10
