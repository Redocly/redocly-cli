arazzo: 1.0.1
info:
  title: X-Security API key auth
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: api-key-auth-workflow
    inputs:
      type: object
      properties:
        secret:
          type: string
    steps:
      - stepId: step-with-api-key-auth-scheme
        operationId: listMenuItems
        parameters:
          - in: header
            name: Authorization
            value: Basic Og==
          - in: query
            name: search
            value: mermaid-treasure-latte
        x-security:
          - scheme:
              type: apiKey
              name: X-API-KEY
              in: header
            values:
              apiKey: $inputs.secret
