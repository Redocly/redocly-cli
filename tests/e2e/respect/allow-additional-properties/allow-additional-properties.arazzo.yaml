arazzo: 1.0.1
info:
  title: Test a response with properties that the schema does not describe
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ./cafe-with-partial-response-schema.yaml

workflows:
  - workflowId: list-menu
    steps:
      - stepId: list-menu-items
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
