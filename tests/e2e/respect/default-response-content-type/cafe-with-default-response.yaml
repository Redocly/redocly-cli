openapi: 3.2.0
info:
  title: Redocly Cafe with a default response
  description: >
    Part of the Redocly Cafe API description where every error is described by
    the default response, and only with the `application/json` media type.
  version: 1.0.0
servers:
  - url: https://api.cafe.redocly.com
paths:
  /menu:
    get:
      summary: List all menu items
      operationId: listMenuItems
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error.
          content:
            application/json:
              schema:
                type: object
