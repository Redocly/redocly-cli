arazzo: 1.0.1
info:
  title: Apply inputs from parent step to steps in target workflow
  description: >-
    Testing functionality of applying inputs from parent step to steps in target workflow
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: order-attempt
    description: >-
      This workflow demonstrates how to pass inputs into an order creation request.
    parameters:
      - in: header
        name: Authorization
        value: $inputs.env.AUTH_TOKEN
      - in: header
        name: multi-word-secret
        value: composed {$inputs.env.AUTH_TOKEN}
    inputs:
      type: object
      properties:
        PROJECT_CLIENT_ID:
          type: string
        PROJECT_CLIENT_SECRET:
          type: string
        PROJECT_SUBSCRIPTION_KEY:
          type: string
        custom_price:
          type: number
        env:
          type: object
          properties:
            AUTH_TOKEN:
              type: string
              format: password
    steps:
      - stepId: create-order
        description: >-
          Try to create an order without a bearer token.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1orders/post'
        requestBody:
          payload:
            PROJECT_CLIENT_ID: $inputs.PROJECT_CLIENT_ID
            PROJECT_CLIENT_SECRET: $inputs.PROJECT_CLIENT_SECRET
            PROJECT_SUBSCRIPTION_KEY: $inputs.PROJECT_SUBSCRIPTION_KEY
            price: $inputs.custom_price
        successCriteria:
          - condition: $statusCode == 401
          - context: $response.body
            condition: "$[?@.title == 'Bearer token is required']"
            type: jsonpath
