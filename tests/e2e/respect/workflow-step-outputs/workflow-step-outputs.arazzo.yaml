arazzo: 1.1.0
info:
  title: Outputs of a step that calls a workflow
  description: >-
    Testing that the outputs of a step with a workflowId read the inputs of the workflow
    the step belongs to, next to the outputs of the called workflow.
    The values are selected from a request body so every printed response body stays deterministic.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: search-ordered-item
    inputs:
      type: object
      properties:
        quantity:
          type: integer
          default: 2
    steps:
      - stepId: find-order-item
        workflowId: submit-order
        outputs:
          quantity: $inputs.quantity
          comments:
            context: $outputs.order
            selector: $.orderItems[?(@.quantity == {$inputs.quantity})].comment
            type: jsonpath
      - stepId: search-menu
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: $steps.find-order-item.outputs.comments#/0
          - in: query
            name: limit
            value: $steps.find-order-item.outputs.quantity
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: submit-order
    steps:
      - stepId: submit-order
        operationId: cafe-api.createOrder
        requestBody:
          payload:
            orderItems:
              - menuItemId: prd_0000000000seedteabv0000000
                quantity: 1
                comment: no-sugar
              - menuItemId: prd_0000000000seedtrams0000000
                quantity: 2
                comment: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 401
        outputs:
          order: $request.body
    outputs:
      order: $steps.submit-order.outputs.order
