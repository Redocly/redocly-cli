arazzo: 1.0.1
info:
  title: Redocly Cafe API
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml

workflows:
  - workflowId: oauth2-auth-workflow
    inputs:
      type: object
      properties:
        secret:
          type: string
    steps:
      - stepId: step-with-oauth2-auth-scheme
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        x-security:
          - scheme:
              type: oauth2
              flows:
                password:
                  tokenUrl: https://example.com/token
                  scopes:
                    read: Read access
            values:
              accessToken: oauth2-token
              clientId: 1234567890
