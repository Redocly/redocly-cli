arazzo: 1.0.1
info:
  title: Severity warn level
  description: >-
    Testing severity levels for failing checks against the Redocly Cafe API
    described with deliberately wrong response definitions.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api-with-errors.yaml

workflows:
  - workflowId: get-menu-items
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    steps:
      - stepId: get-menu-items
        parameters:
          - in: header
            name: Content-Type
            value: application/json
          - in: query
            name: search
            value: mermaid-treasure-latte
        description: >-
          List menu items by resolving request details with listMenuItems operationId from Cafe API description.
        operationId: cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menu: $response.body
  - workflowId: order-attempt
    description: >-
      This workflow demonstrates how to attempt an order and retrieve a menu item photo description.
    steps:
      - stepId: create-order
        description: >-
          Try to create an order without a bearer token.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1orders/post'
        requestBody:
          payload:
            customerName: respect-e2e-customer
        successCriteria:
          - condition: $statusCode == 401
          - context: $response.body
            condition: "$[?@.title == 'Bearer token is required']"
            type: jsonpath
          - context: $response.body
            condition: '$[?@.status == 401]'
            type:
              type: jsonpath
              version: draft-goessner-dispatch-jsonpath-00
        outputs:
          errorTitle: $response.body#/title

      - stepId: get-menu-item-photo
        description: >-
          Retrieve the photo text description of a seeded menu item.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu-item-images~1{menuItemId}/get'
        parameters:
          - name: menuItemId
            in: path
            value: prd_0000000000seedtrams0000000
          - in: header
            name: Accept
            value: text/plain
          - in: header
            name: x-error-title
            value: $steps.create-order.outputs.errorTitle
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body == 'A classic Italian tiramisu layered with mascarpone and espresso'
