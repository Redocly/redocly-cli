arazzo: 1.0.1
info:
  title: Redocly Cafe API
  description: >-
    Testing severity levels for failing checks against the Redocly Cafe API
    described with deliberately wrong response definitions.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api-with-errors.yaml

workflows:
  - workflowId: get-menu-items
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    steps:
      - stepId: get-menu-items
        parameters:
          - in: header
            name: Content-Type
            value: application/json
          - in: query
            name: search
            value: mermaid-treasure-latte
        description: >-
          List menu items by resolving request details with listMenuItems operationId from cafe-api.yaml description.
        operationId: cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menu: $response.body
  - workflowId: client-registration
    description: >-
      This workflow demonstrates how to register an OAuth2 client and retrieve a menu item photo description.
    steps:
      - stepId: create-client
        description: >-
          Try to register a new OAuth2 client without the required `name` field.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1oauth2~1register/post'
        requestBody:
          payload:
            clientName: respect-e2e-client
        successCriteria:
          - condition: $statusCode == 400
          - context: $response.body
            condition: "$[?@.title == 'Validation failed']"
            type: jsonpath
          - context: $response.body
            condition: '$[?@.status == 400]'
            type:
              type: jsonpath
              version: draft-goessner-dispatch-jsonpath-00
        outputs:
          errorField: $response.body#/details/errors/0/path/0
          errorTitle: $response.body#/title

      - stepId: get-menu-item-photo
        description: >-
          Retrieve the photo text description of a seeded menu item.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu-item-images~1{menuItemId}/get'
        parameters:
          - name: menuItemId
            in: path
            value: prd_0000000000seedtrams0000000
          - in: header
            name: Accept
            value: text/plain
          - in: header
            name: x-error-field
            value: $steps.create-client.outputs.errorField
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body == 'A classic Italian tiramisu layered with mascarpone and espresso'
