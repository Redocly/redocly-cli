arazzo: 1.0.1
info:
  title: Test `failureActions` in workflows
  description: Testing functionality of `end` action in `onFailure` action.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml

workflows:
  - workflowId: client-registration
    description: >-
      This workflow demonstrates how to list menu items and register an OAuth2 client in the cafe API.
    steps:
      - stepId: list-menu-items
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        outputs:
          menuItems: $response.body
        successCriteria:
          - condition: $statusCode == 201
        onFailure:
          - type: end
            name: step-onFailure-action-end
            criteria:
              - condition: $statusCode == 200
          # This goto action should not be called because previous action is an end action.
          - type: goto
            name: step-onFailure-action-goto
            stepId: create-client
          - type: retry
            name: step-onFailure-action-retry
            retryLimit: 1
            retryAfter: 3
      - stepId: create-client
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1oauth2~1register/post'
        requestBody:
          payload:
            name: respect-e2e-client
            grantTypes:
              - client_credentials
        successCriteria:
          - condition: $statusCode == 201
  - workflowId: get-menu-items
    steps:
      - stepId: get-menu-items
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 200
