arazzo: 1.1.0
info:
  title: Invalid inputs preserve workflow failure handling
  version: 1.0.0
sourceDescriptions:
  - name: cafe
    type: openapi
    url: ./openapi.yaml
workflows:
  - workflowId: invalid-parent
    inputs: &required-inputs
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
    dependsOn: [sibling]
    steps: &unexpected-steps
      - stepId: unexpected
        operationId: cafe.createOrder
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: invalid-dependency
    dependsOn: [sibling, child]
    steps: *unexpected-steps
  - workflowId: sibling
    steps: *unexpected-steps
  - workflowId: child
    inputs: *required-inputs
    steps:
      - stepId: child-order
        operationId: cafe.createOrder
        requestBody:
          contentType: application/json
          payload:
            text: $inputs.text
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: invoke-end
    steps:
      - stepId: invoke
        workflowId: child
        onFailure:
          - name: stop-parent
            type: end
      - stepId: unexpected
        operationId: cafe.createOrder
  - workflowId: invoke-goto
    steps:
      - stepId: invoke
        workflowId: child
        onFailure:
          - name: recover
            type: goto
            stepId: recovery
      - stepId: unexpected
        operationId: cafe.createOrder
      - stepId: recovery
        operationId: cafe.prepareOrder
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: workflow-failure-action
    failureActions:
      - name: recover-with-valid-inputs
        type: goto
        workflowId: child
        parameters:
          - name: text
            value: recovered-order
    steps:
      - stepId: invoke
        workflowId: child
      - stepId: unexpected
        operationId: cafe.prepareOrder
  - workflowId: invoke-invalid-dependency
    steps:
      - stepId: invoke
        workflowId: invalid-dependency
        onFailure:
          - name: stop-parent
            type: end
      - stepId: unexpected
        operationId: cafe.prepareOrder
  - workflowId: deep-dependency
    dependsOn: [sibling, invalid-dependency]
    steps: *unexpected-steps
  - workflowId: valid-nested
    dependsOn: [valid-middle]
    steps:
      - stepId: finish
        operationId: cafe.prepareOrder
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: valid-middle
    inputs: *required-inputs
    dependsOn: [sibling]
    steps:
      - stepId: mapped-order
        operationId: cafe.createOrder
        requestBody:
          contentType: application/json
          payload:
            text: $inputs.text
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: circular-dependency
    dependsOn: [circular-dependency]
    steps: *unexpected-steps
  - workflowId: following
    steps:
      - stepId: independent
        operationId: cafe.prepareOrder
        successCriteria:
          - condition: $statusCode == 200
