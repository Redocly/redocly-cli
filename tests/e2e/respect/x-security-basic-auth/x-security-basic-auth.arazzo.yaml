arazzo: 1.0.1
info:
  title: Redocly Cafe API
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml

workflows:
  - workflowId: basic-auth-workflow
    inputs:
      type: object
      properties:
        secret:
          type: string
    steps:
      - stepId: step-with-basic-auth-scheme
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        x-security:
          - scheme:
              type: http
              scheme: basic
            values:
              username: John
              password: $inputs.secret
