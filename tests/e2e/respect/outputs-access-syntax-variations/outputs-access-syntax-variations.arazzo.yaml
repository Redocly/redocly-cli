arazzo: 1.0.1
info:
  title: Redocly Cafe API
  description: >-
    Testing outputs access syntax variations against the Redocly Cafe API.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    steps:
      - stepId: get-menu-items
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menu: $response.body
          pageLimit: $response.body#/page/limit
      - stepId: search-menu
        # the legacy `$sourceDescriptions.<name>.workflows.<workflowId>` form is kept here for backward compatibility coverage
        workflowId: $sourceDescriptions.menu-from-cafe-api.workflows.search-menu-items
        outputs:
          total: $outputs.total
          itemsCount: $outputs.stepFullBody#/page/total
    outputs:
      itemsCount: $steps.search-menu.outputs.itemsCount
  - workflowId: client-registration
    steps:
      - stepId: list-menu-items
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        outputs:
          menuItems: $response.body
      - stepId: create-client
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1oauth2~1register/post'
        requestBody:
          payload:
            listObject: $steps.list-menu-items.outputs.menuItems.page.limit
            listTotal: $steps.list-menu-items.outputs.menuItems#/page/total
        successCriteria:
          - condition: $statusCode == 400
          - condition: $workflows.get-menu-items.outputs.itemsCount == 0
        outputs:
          errorStatus: $response.body#/status
          createdClientError: $response.body
    outputs:
      createdClientError: $steps.create-client.outputs.createdClientError
  - workflowId: get-menu-items-by-error-field
    steps:
      - stepId: get-menu-items-by-error-field
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        parameters:
          - name: search
            in: query
            value: $workflows.client-registration.outputs.createdClientError#/details/errors/0/path/0
          - name: x-original-message
            in: header
            value: $workflows.client-registration.outputs.createdClientError.details.errors.0.message
        successCriteria:
          - condition: $workflows.client-registration.outputs.createdClientError#/status == 400
