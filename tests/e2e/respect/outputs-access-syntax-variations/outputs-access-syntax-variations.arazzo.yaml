arazzo: 1.0.1
info:
  title: Outputs access syntax variations
  description: >-
    Testing outputs access syntax variations against the Redocly Cafe API.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    steps:
      - stepId: get-menu-items
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menu: $response.body
          pageLimit: $response.body#/page/limit
      - stepId: search-menu
        # the legacy `$sourceDescriptions.<name>.workflows.<workflowId>` form is kept here for backward compatibility coverage
        workflowId: $sourceDescriptions.menu-from-cafe-api.workflows.search-menu-items
        outputs:
          total: $outputs.total
          itemsCount: $outputs.stepFullBody#/page/total
    outputs:
      itemsCount: $steps.search-menu.outputs.itemsCount
  - workflowId: order-attempt
    steps:
      - stepId: list-menu-items
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        outputs:
          menuItems: $response.body
      - stepId: create-order
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1orders/post'
        requestBody:
          payload:
            listObject: $steps.list-menu-items.outputs.menuItems.page.limit
            listTotal: $steps.list-menu-items.outputs.menuItems#/page/total
            orderItems:
              - menuItemId: prd_0000000000seedtrams0000000
                quantity: 2
                comment: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 401
          - condition: $workflows.get-menu-items.outputs.itemsCount == 0
        outputs:
          orderError: $response.body
          submittedOrder: $request.body
    outputs:
      orderError: $steps.create-order.outputs.orderError
      submittedOrder: $steps.create-order.outputs.submittedOrder
  - workflowId: get-menu-items-by-submitted-order
    steps:
      - stepId: get-menu-items-by-submitted-order
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        parameters:
          - name: search
            in: query
            value: $workflows.order-attempt.outputs.submittedOrder#/orderItems/0/comment
          - name: x-original-quantity
            in: header
            value: $workflows.order-attempt.outputs.submittedOrder.orderItems.0.quantity
        successCriteria:
          - condition: $workflows.order-attempt.outputs.orderError#/status == 401
