arazzo: 1.0.1
info:
  title: Test reusable $components
  description: Testing functionality of reusable $components
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    inputs:
      $ref: '#/components/inputs/reusable-test'
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    parameters:
      - reference: $components.parameters.pageSize
        value: 256
      - in: header
        name: Authorization
        value: Basic Og==
    outputs:
      reusable-test: $inputs.reusable-test
    steps:
      - stepId: get-menu-items-step-success-action
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menu: $response.body
      - stepId: get-menu-items-step-failure-action-goto
        description: >-
          List menu items by resolving request details with listMenuItems operationId from cafe-api.yaml description.
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          menu: $response.body
        onFailure:
          - reference: $components.failureActions.gotoFailureAction
      - stepId: get-menu-items-step-failure-action-retry
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          menu: $response.body
        onFailure:
          - reference: $components.failureActions.retryFailureAction
  - workflowId: client-registration
    inputs:
      $ref: '#/components/inputs/buy_available_pet_input'
    parameters:
      - reference: $components.parameters.pageSize
        value: 256
      - in: header
        name: Authorization
        value: Basic Og==
      - reference: $components.parameters.page
        value: 42
    steps:
      - stepId: list-menu-items
        parameters:
          - reference: $components.parameters.page
          - in: query
            name: search
            value: mermaid-treasure-latte
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        outputs:
          menuItems: $response.body
      - stepId: create-client
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1oauth2~1register/post'
        requestBody:
          payload:
            reusable: $workflows.get-menu-items.outputs.reusable-test
            store_id: $inputs.store_id
            my_pet_tags: $inputs.my_pet_tags
        successCriteria:
          - condition: $statusCode == 400
  - workflowId: final-workflow
    inputs:
      $ref: '#/components/inputs/reusable-test'
    parameters:
      - reference: $components.parameters.pageSize
        value: 256
      - in: header
        name: Authorization
        value: Basic Og==
    steps:
      - stepId: final-workflow-step
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200

components:
  inputs:
    reusable-test:
      type: string
      description: This is a reusable input component
    buy_available_pet_input:
      type: object
      properties:
        my_pet_tags:
          type: array
          items:
            type: string
          description: Desired tags to use when searching for a pet, in CSV format (e.g. "puppy, dalmatian")
        store_id:
          $ref: '#/components/inputs/store_id'
    store_id:
      type: string
      description: Indicates the domain name of the store where the customer is browsing or buying pets, e.g. "pets.example.com" or "pets.example.co.uk".
  parameters:
    page:
      name: page
      in: header
      value: 1
    pageSize:
      name: pageSize
      in: header
      value: 100
  failureActions:
    gotoFailureAction:
      name: get-menu-items-failure-action
      type: goto
      workflowId: final-workflow
      criteria:
        - condition: $statusCode == 200
    retryFailureAction:
      name: get-menu-items-failure-action
      type: retry
      retryAfter: 3
      retryLimit: 1
      workflowId: final-workflow
      criteria:
        - condition: $statusCode == 200
  successActions:
    gotoSuccessAction:
      name: get-menu-items-success-action
      type: goto
      workflowId: final-workflow
      criteria:
        - condition: $statusCode == 200
