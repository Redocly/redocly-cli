arazzo: 1.0.1
info:
  title: Test inputs with CLI and env
  description: >-
    This test demonstrates how to use inputs and environment variables in an API test.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    inputs:
      type: object
      properties:
        env:
          type: object
          properties:
            AUTH_TOKEN:
              type: string
            organizationId:
              type: string
              default: acme-inc
    description: >-
      This workflow demonstrates how to list the cafe menu items and search the menu.
    parameters:
      - in: header
        name: Authorization
        value: $inputs.env.AUTH_TOKEN
    steps:
      - stepId: get-menu-items
        description: >-
          List menu items by resolving request details with listMenuItems operationId from cafe-api.yaml description.
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menu: $response.body
      - stepId: search-menu
        description: >-
          Search the cafe menu by calling an external workflow from another Arazzo file.
        workflowId: $sourceDescriptions.menu-from-cafe-api.search-menu-items
        outputs:
          total: $outputs.total
      - stepId: test-default-input
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
          - in: query
            name: organizationId
            value: $inputs.env.organizationId
  - workflowId: client-registration
    inputs:
      type: object
      properties:
        env:
          type: object
          properties:
            AUTH_TOKEN:
              type: string
        username:
          type: string
        password:
          type: string
    description: >-
      This workflow demonstrates how to pass inputs into an OAuth2 client registration request.
    parameters:
      - in: header
        name: Authorization
        value: Basic Og==
    steps:
      - stepId: create-client
        parameters:
          - in: header
            name: username-token
            value: $inputs.env.AUTH_TOKEN
        description: >-
          Try to register a new OAuth2 client without the required `name` field.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1oauth2~1register/post'
        requestBody:
          payload:
            additionalName: $inputs.username
            additionalPassword: $inputs.password
            additionalEnv: $inputs.env.AUTH_TOKEN
        successCriteria:
          - condition: $statusCode == 400
          - context: $response.body
            condition: "$[?@.title == 'Validation failed']"
            type: jsonpath
