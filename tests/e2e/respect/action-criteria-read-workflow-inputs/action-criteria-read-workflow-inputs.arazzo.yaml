arazzo: 1.0.1
info:
  title: Test that the criteria of a success action read the workflow inputs
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: search-menu
    inputs:
      type: object
      properties:
        searchAgain:
          type: boolean
          default: true
    steps:
      - stepId: search-menu-items
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: search-again
            type: goto
            stepId: search-menu-items-again
            criteria:
              - condition: $inputs.searchAgain == true
          - name: finish
            type: end
      - stepId: search-menu-items-again
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: unicorn-glitter-mocha
        successCriteria:
          - condition: $statusCode == 200
