arazzo: 1.0.1
info:
  title: Test `failureActions` in workflows
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    failureActions:
      - name: repeated-failure-action-1
        type: retry
        retryLimit: 1
        workflowId: $sourceDescriptions.menu-from-cafe-api.search-menu-items
        criteria:
          - condition: $statusCode == 200
      - name: repeated-failure-action-2 # this should not be executed as there is another action with the s
        type: goto
        workflowId: $sourceDescriptions.menu-from-cafe-api.search-menu-items
        criteria:
          - condition: $statusCode == 200
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    steps:
      - stepId: get-menu-items
        description: >-
          List menu items by resolving request details with listMenuItems operationId from cafe-api.yaml description.
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          menuItems: $response.body
      - stepId: get-menu-items-2
        description: >-
          List menu items by resolving request details with listMenuItems operationId from cafe-api.yaml description.
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          menuItems: $response.body
        onFailure:
          - type: retry
            name: not-executed-retry
            retryLimit: 1
            criteria:
              - condition: $statusCode == 999
          - type: retry
            name: step-onFailure-action
            retryLimit: 1
            criteria:
              - condition: $statusCode == 200
