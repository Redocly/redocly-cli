arazzo: 1.0.1
info:
  title: X-Security resolve scheme name
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: menu-items
    inputs:
      type: object
      properties:
        secret:
          type: string
    steps:
      - stepId: apply-oauth2-scheme-when-step-has-operationId
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        x-security:
          - schemeName: OAuth2
            values:
              accessToken: $inputs.secret
      - stepId: apply-api-key-scheme-when-step-has-operationPath
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        x-security:
          - schemeName: ApiKey
            values:
              apiKey: $inputs.secret
