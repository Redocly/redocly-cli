arazzo: 1.1.0
info:
  title: Test `parameters` of success and failure actions
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

components:
  parameters:
    search:
      name: search
      value: unicorn-glitter-mocha
    search-in-query:
      name: search
      in: query
      value: unicorn-glitter-mocha

workflows:
  - workflowId: success-action-parameters
    steps:
      - stepId: search-menu-items
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: search-again
            type: goto
            workflowId: search-menu
            parameters:
              - name: search
                value: mermaid-treasure-{$statusCode}

  - workflowId: failure-action-parameters
    steps:
      - stepId: list-menu-items-with-invalid-limit
        operationId: listMenuItems
        parameters:
          - in: query
            name: limit
            value: abc
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: search-then-retry
            type: retry
            retryLimit: 1
            workflowId: search-menu
            parameters:
              - reference: $components.parameters.search

  - workflowId: failure-action-parameter-with-in
    steps:
      - stepId: list-menu-items-with-invalid-limit
        operationId: listMenuItems
        parameters:
          - in: query
            name: limit
            value: abc
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: goto-search
            type: goto
            workflowId: search-menu
            parameters:
              - reference: $components.parameters.search-in-query

  - workflowId: search-menu
    inputs:
      type: object
      properties:
        search:
          type: string
          default: mermaid-treasure-cortado
    steps:
      - stepId: search-menu-items
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: $inputs.search
        successCriteria:
          - condition: $statusCode == 200
