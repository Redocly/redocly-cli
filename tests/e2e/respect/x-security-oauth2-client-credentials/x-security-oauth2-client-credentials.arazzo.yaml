arazzo: 1.0.1
info:
  title: X-Security OAuth2 client credentials
  description: >-
    The `register` workflow registers a new OAuth2 client and must run first, and the `cleanup` workflow deletes it.
    The `orders` workflow gives the client credentials to `x-security`, and Respect requests the access token itself.
    The token is requested with the `orders:read` scope only, so the client reads orders but cannot create one.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: register
    steps:
      - stepId: register-client
        operationId: registerOAuth2Client
        requestBody:
          payload:
            client_name: respect-e2e-client-credentials
            grant_types:
              - client_credentials
            scope: orders:read orders:write
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          clientId: $response.body#/client_id
          clientSecret: $response.body#/client_secret
          registrationAccessToken: $response.body#/registration_access_token
    outputs:
      clientId: $steps.register-client.outputs.clientId
      clientSecret: $steps.register-client.outputs.clientSecret
      registrationAccessToken: $steps.register-client.outputs.registrationAccessToken

  - workflowId: orders
    x-security:
      - schemeName: OAuth2
        values:
          clientId: $workflows.register.outputs.clientId
          clientSecret: $workflows.register.outputs.clientSecret
          scope: orders:read
    steps:
      - stepId: list-orders
        operationId: listOrders
        successCriteria:
          - condition: $statusCode == 200
      - stepId: create-order-without-write-scope
        operationId: createOrder
        requestBody:
          payload:
            customerName: Respect
            orderItems:
              - menuItemId: prd_0000000000seedtrams0000000
                quantity: 1
        successCriteria:
          - condition: $statusCode == 403

  - workflowId: cleanup
    steps:
      - stepId: delete-client
        operationId: deleteOAuth2Client
        parameters:
          - in: path
            name: clientId
            value: $workflows.register.outputs.clientId
        x-security:
          - schemeName: RegistrationAccessToken
            values:
              token: $workflows.register.outputs.registrationAccessToken
        successCriteria:
          - condition: $statusCode == 204
