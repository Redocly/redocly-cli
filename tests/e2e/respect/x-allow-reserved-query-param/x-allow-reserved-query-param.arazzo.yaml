arazzo: 1.0.1
info:
  title: Allow reserved query params
  version: 1.0.0
sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
workflows:
  - workflowId: allow-reserved
    steps:
      - stepId: get-with-allow-reserved
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: 2023-02-23
          - in: query
            name: filter
            value: 'https://example.com/path/to;x,y(z)a*b.c[1]@v'
            x-allowReserved: true
        successCriteria:
          - condition: $statusCode == 400
