openapi: 3.2.0
info:
  title: Redocly Cafe with a recursive schema
  description: >
    Part of the Redocly Cafe API description where a problem can carry the
    problem that caused it, so the `Problem` schema references itself.
  version: 1.0.0
servers:
  - url: https://api.cafe.redocly.com
paths:
  /menu:
    get:
      summary: List all menu items
      operationId: listMenuItems
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        instance:
          type: string
        cause:
          $ref: '#/components/schemas/Problem'
      required:
        - type
        - title
        - status
