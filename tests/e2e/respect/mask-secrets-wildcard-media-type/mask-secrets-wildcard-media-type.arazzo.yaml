arazzo: 1.0.1
info:
  title: Mask secrets described under wildcard media types
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ./cafe-with-wildcard-media-types.yaml

workflows:
  - workflowId: order-attempt
    steps:
      - stepId: create-order
        description: >-
          Try to create an order without a bearer token.
        operationId: createOrder
        requestBody:
          contentType: application/json
          payload:
            customerName: Mary Ann
            pickupCode: cafe-pickup-1234
        successCriteria:
          - condition: $statusCode == 401
