arazzo: 1.0.1
info:
  title: Test `successActions` in workflows
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    successActions:
      - name: repeated-success-action-1
        type: goto
        workflowId: $sourceDescriptions.menu-from-cafe-api.search-menu-items
        criteria:
          - condition: $statusCode == 200
      - name: repeated-success-action-2 # this should not be executed as there is another action with the same criteria
        type: goto
        workflowId: client-registration
        criteria:
          - condition: $statusCode == 200
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    steps:
      - stepId: get-menu-items
        description: >-
          List menu items by resolving request details with listMenuItems operationId from cafe-api.yaml description.
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menuItems: $response.body
  - workflowId: client-registration
    description: >-
      This workflow demonstrates how to list menu items and register an OAuth2 client in the cafe API.
    steps:
      - stepId: list-menu-items
        description: >-
          Request the list of menu items.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        outputs:
          menuItems: $response.body
        onSuccess:
          - type: goto
            name: step-onSuccess-action
            workflowId: $sourceDescriptions.menu-from-cafe-api.search-menu-items
            criteria:
              - condition: $statusCode == 200
      - stepId: create-client
        description: >-
          Register a new OAuth2 client.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1oauth2~1register/post'
        onSuccess:
          - type: goto
            name: step-onSuccess-action-2
            stepId: list-menu-items
            criteria:
              - condition: $statusCode == 201
        requestBody:
          payload:
            name: respect-e2e-client
            grantTypes:
              - client_credentials
        successCriteria:
          - condition: $statusCode == 201
          - context: $response.body
            condition: "$[?@.name == 'respect-e2e-client']"
            type:
              type: jsonpath
              version: draft-goessner-dispatch-jsonpath-00
