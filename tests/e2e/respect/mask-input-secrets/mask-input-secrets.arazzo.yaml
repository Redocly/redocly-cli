arazzo: 1.0.1
info:
  title: Mask sensitive input values
  description: >-
    Testing functionality of masking sensitive input values in verbose output
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    inputs:
      type: object
      properties:
        username:
          type: string
        env:
          type: object
          properties:
            AUTH_TOKEN:
              type: string
              format: password
        password:
          type: string
          format: password
          description: additional password.
    parameters:
      - in: header
        name: Authorization
        value: $inputs.env.AUTH_TOKEN
      - in: header
        name: password
        value: $inputs.password
      - in: header
        name: username
        value: $inputs.username
      - in: header
        name: masked-combined-value
        value: '{$inputs.username} and {$inputs.password} and maybe {$inputs.env.AUTH_TOKEN}'
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    steps:
      - stepId: get-menu-items
        parameters:
          - in: header
            name: multi-word-secret
            value: Bearer {$inputs.password}
          - in: query
            name: search
            value: mermaid-treasure-latte
        description: >-
          List menu items by resolving request details with listMenuItems operationId from cafe-api.yaml description.
        operationId: $sourceDescriptions.cafe-api.listMenuItems
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          menu: $response.body
  - workflowId: client-registration
    description: >-
      This workflow demonstrates how sensitive inputs are masked in an OAuth2 client registration request.
    parameters:
      - in: header
        name: Authorization
        value: $inputs.env.AUTH_TOKEN
      - in: header
        name: multi-word-secret
        value: composed {$inputs.env.AUTH_TOKEN}
    inputs:
      type: object
      properties:
        username:
          type: string
        env:
          type: object
          properties:
            AUTH_TOKEN:
              type: string
              format: password
        password:
          type: string
          format: password
        secret:
          type: object
          properties:
            secretValue:
              type: string
              format: password
    steps:
      - stepId: list-menu-items
        description: >-
          Request the list of menu items.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        outputs:
          menuItems: $response.body
      - stepId: create-client
        description: >-
          Try to register a new OAuth2 client without the required `name` field.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1oauth2~1register/post'
        requestBody:
          payload:
            username: $inputs.username
            secret: $inputs.password
            multiwordSecret: Bearer {$inputs.secret.secretValue}
        successCriteria:
          - condition: $statusCode == 400
          - context: $response.body
            condition: "$[?@.title == 'Validation failed']"
            type: jsonpath
