openapi: 3.2.0
info:
  title: Redocly Cafe with a status code range
  description: >
    Part of the Redocly Cafe API description where the successful response is
    described with the `2XX` status code range.
  version: 1.0.0
servers:
  - url: https://api.cafe.redocly.com
paths:
  /menu:
    get:
      summary: List all menu items
      operationId: listMenuItems
      security: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        2XX:
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  page:
                    type: object
                  items:
                    type: array
