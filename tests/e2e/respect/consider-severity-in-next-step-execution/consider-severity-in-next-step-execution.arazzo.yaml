arazzo: 1.0.1
info:
  title: Consider severity in next step execution
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: first-workflow
    steps:
      - stepId: first-step
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: second-workflow
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    steps:
      - stepId: list-menu-items
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        successCriteria:
          #  Make this check fail
          - condition: $statusCode == 201
        # should not follow the default behavior to break and return if onFailure omitted with warn severity and continue execution of the next step
      - stepId: call-first-workflow
        workflowId: first-workflow
