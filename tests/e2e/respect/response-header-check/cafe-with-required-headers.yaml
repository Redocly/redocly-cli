openapi: 3.2.0
info:
  title: Redocly Cafe with required response headers
  description: >
    Part of the Redocly Cafe API description where the responses mark headers
    as required. The API returns `ETag` but not `X-Request-ID`.
  version: 1.0.0
servers:
  - url: https://api.cafe.redocly.com
paths:
  /menu:
    get:
      summary: List all menu items
      operationId: listMenuItems
      security: []
      responses:
        '200':
          description: Successful operation.
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  page:
                    type: object
                  items:
                    type: array
  /menu-item-images/{menuItemId}:
    get:
      summary: Retrieve a menu item photo
      operationId: getMenuItemPhoto
      security: []
      parameters:
        - name: menuItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item photo retrieved successfully.
          headers:
            X-Request-ID:
              required: true
              schema:
                type: string
          content:
            image/png: {}
