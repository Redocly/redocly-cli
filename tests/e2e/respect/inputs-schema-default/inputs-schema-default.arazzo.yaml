arazzo: 1.0.1
info:
  title: Test that the run uses an inputs schema with a default at its top level and at the top of `env`
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: search-menu
    inputs:
      type: object
      default: {}
      properties:
        search:
          type: string
          default: mermaid-treasure-latte
          example: espresso
        env:
          type: object
          default:
            CAFE_MENU_TAG: from-env-default
          properties:
            CAFE_MENU_TAG:
              type: string
    steps:
      - stepId: search-menu-items
        operationId: cafe-api.listMenuItems
        parameters:
          - in: query
            name: search
            value: $inputs.search
        successCriteria:
          - condition: $statusCode == 200
          - condition: $inputs.env.CAFE_MENU_TAG == "from-env-default"
