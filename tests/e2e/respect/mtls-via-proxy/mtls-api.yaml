openapi: 3.1.0
info:
  title: mTLS API
  version: 1.0.0
servers:
  - url: https://localhost:3443
paths:
  /whoami:
    get:
      operationId: whoami
      responses:
        '200':
          description: The client certificate the server received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientCert:
                    type: string
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Whether the server received a multipart body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  multipart:
                    type: boolean
