openapi: 3.2.0
info:
  title: Redocly Cafe menu
  description: >
    Part of the Redocly Cafe API description with the public menu operations.
    A parameter of the operation that creates a menu item has no name, so the coverage cannot be measured.
  version: 1.0.0
servers:
  - url: https://api.cafe.redocly.com
paths:
  /menu:
    get:
      summary: List all menu items
      operationId: listMenuItems
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Create menu item
      operationId: createMenuItem
      parameters:
        - in: header
          schema:
            type: string
      responses:
        '201':
          description: Menu item created.
