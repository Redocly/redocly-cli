arazzo: 1.0.1
info:
  title: Check the errors of the cafe menu
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: menu-api
    type: openapi
    url: ./cafe-menu.yaml

workflows:
  - workflowId: menu-errors
    steps:
      - stepId: list-menu-items-with-invalid-limit
        operationId: listMenuItems
        parameters:
          - in: query
            name: limit
            value: abc
        successCriteria:
          - condition: $statusCode == 400
      - stepId: get-photo-of-unknown-menu-item
        operationId: getMenuItemPhoto
        parameters:
          - in: path
            name: menuItemId
            value: prd_01h1s5z6vf2mm1mz3hevnn9va7
        successCriteria:
          - condition: $statusCode == 404
