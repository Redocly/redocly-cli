arazzo: 1.0.1
info:
  title: List the cafe menu
  description: Testing functionality based on the Redocly Cafe API example
  version: 1.0.0

sourceDescriptions:
  - name: cafe-menu
    type: openapi
    url: ./cafe-menu-unnamed-parameter.yaml

workflows:
  - workflowId: list-menu
    steps:
      - stepId: list-menu-items
        operationId: listMenuItems
        parameters:
          - in: query
            name: limit
            value: 1
        successCriteria:
          - condition: $statusCode == 200
