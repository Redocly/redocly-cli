arazzo: 1.0.1
info:
  title: Test requestBody `replacements` in steps
  description: Testing functionality of requestBody `replacements`.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml

workflows:
  - workflowId: replacements
    description: >-
      This workflow demonstrates how to replace values in the request body.
    steps:
      - stepId: first-step
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        outputs:
          menu: $response.body
      - stepId: step-with-json-replacements
        operationId: registerOAuth2Client
        requestBody:
          contentType: application/json
          payload: $steps.first-step.outputs.menu
          replacements:
            - target: /object
              value: 'my-custom-object'
            - target: /items
              value: $steps.first-step.outputs.menu#/object
            - target: /page
              value:
                - '2025-01-01'
        successCriteria:
          - condition: $statusCode == 400

      - stepId: step-with-form-urlencoded-replacements
        operationId: createOrder
        requestBody:
          contentType: application/x-www-form-urlencoded
          payload: customerName={$steps.first-step.outputs.menu#/object}&location=Lviv"
          replacements:
            - target: /location
              value: 'New York'
        successCriteria:
          - condition: $statusCode == 401
      - stepId: step-with-form-urlencoded-replacements-2
        operationId: createOrder
        requestBody:
          contentType: application/x-www-form-urlencoded
          payload:
            customerName: $steps.first-step.outputs.menu#/object
            location: Lviv
          replacements:
            - target: /location
              value: 'Jakarta'
        successCriteria:
          - condition: $statusCode == 401
