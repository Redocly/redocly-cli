openapi: 3.0.3
info:
  title: Redocly Cafe with nullable schemas without a type
  description: >
    Part of the Redocly Cafe API description where two response schemas
    use `nullable` without `type`.
  version: 1.0.0
servers:
  - url: https://api.cafe.redocly.com
paths:
  /menu:
    get:
      summary: List all menu items
      operationId: listMenuItems
      security: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  page:
                    nullable: true
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
components:
  schemas:
    MenuItem:
      nullable: true
      allOf:
        - type: object
