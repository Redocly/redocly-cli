arazzo: 1.0.1
info:
  title: Redocly Cafe API
  description: >-
    Testing server override with console parameters against the Redocly Cafe API.
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: ../cafe-api.yaml
  - name: menu-from-cafe-api
    type: arazzo
    url: ../cafe-menu.arazzo.yaml

workflows:
  - workflowId: get-menu-items
    description: >-
      This workflow demonstrates how to search the cafe menu using an external workflow.
    steps:
      - stepId: search-menu
        description: >-
          Search the cafe menu by calling an external workflow from another Arazzo file.
        workflowId: $sourceDescriptions.menu-from-cafe-api.search-menu-items
        outputs:
          total: $outputs.total
  - workflowId: client-registration
    description: >-
      This workflow demonstrates how to list the cafe menu items.
    steps:
      - stepId: list-menu-items
        description: >-
          Request the list of menu items.
        operationPath: '{$sourceDescriptions.cafe-api.url}#/paths/~1menu/get'
