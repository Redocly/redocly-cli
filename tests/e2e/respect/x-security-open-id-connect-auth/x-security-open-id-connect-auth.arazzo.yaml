arazzo: 1.0.1
info:
  title: X-Security OpenID Connect auth
  version: 1.0.0

sourceDescriptions:
  - name: cafe-api
    type: openapi
    url: https://cafe.redocly.com/_bundle/openapi/cafe.yaml

workflows:
  - workflowId: open-id-connect-auth-workflow
    inputs:
      type: object
      properties:
        secret:
          type: string
    steps:
      - stepId: step-with-open-id-connect-auth-scheme
        operationId: listMenuItems
        parameters:
          - in: query
            name: search
            value: mermaid-treasure-latte
        x-security:
          - scheme:
              type: openIdConnect
              openIdConnectUrl: https://example.com/token
            values:
              accessToken: openIdConnect-token
