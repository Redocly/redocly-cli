# redocly.yaml — drives `redocly generate-client` for this example.
# The custom generator is selected by path, beside the built-in `typescript`.
apis:
  valibot-generator:
    root: ../_shared/cafe.yaml
    clientOutput: ./src/api/client.ts
    client:
      generators:
        - typescript
        - ./valibot-schema-generator.mjs
