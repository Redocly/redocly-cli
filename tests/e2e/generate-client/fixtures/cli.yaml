openapi: 3.1.0
info:
  title: Cafe CLI API
  version: 1.0.0
servers:
  - url: http://localhost:3108
security:
  - BearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders, one cursor page at a time.
      tags: [orders]
      x-redocly-pagination:
        style: cursor
        cursorParam: cursor
        nextCursor: /nextCursor
        limitParam: limit
        items: /orders
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
      responses:
        '200':
          description: One page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  nextCursor: { type: string }
    post:
      operationId: createOrder
      summary: Place an order.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '201':
          description: The created order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: One order by id.
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /ping:
    get:
      operationId: ping
      responses:
        '204':
          description: Alive.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Order:
      type: object
      required: [item, quantity]
      properties:
        id: { type: string }
        item: { type: string }
        quantity: { type: integer, minimum: 1 }
