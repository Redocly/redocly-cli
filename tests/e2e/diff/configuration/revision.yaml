openapi: 3.1.0
info: { title: Cafe, version: 1.3.0 }
servers:
  - url: https://api.cafe.test
security:
  - apiKey: []
paths:
  /menu:
    get:
      summary: List the whole menu
      parameters:
        - { name: limit, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
  /menu/{menuItemId}:
    get:
      parameters:
        - { name: menuItemId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /orders:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '201':
          description: Created
  /specials:
    get:
      responses:
        '200': { description: OK }
webhooks:
  orderReady:
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { orderId: { type: string } } }
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-Key }
  schemas:
    MenuItem:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [available, sold-out, seasonal] }
    Order:
      type: object
      required: [items, pickupAt]
      properties:
        items: { type: array, items: { type: string } }
        note: { type: string, maxLength: 100 }
        pickupAt: { type: string, format: date-time }
