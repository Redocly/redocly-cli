openapi: 3.1.0
info:
  title: security-scopes-added
  version: '1.0'
paths:
  /pets:
    get:
      security:
        - oauth:
            - pets:read
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/token
          scopes:
            pets:read: Read pets
            pets:write: Write pets
