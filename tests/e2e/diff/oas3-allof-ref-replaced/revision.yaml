openapi: 3.1.0
info:
  title: allof-ref-replaced
  version: '1.0'
paths:
  /pets:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tagged'
components:
  schemas:
    Named:
      type: object
      properties:
        name: { type: string }
    Tagged:
      type: object
      properties:
        tag: { type: string }
