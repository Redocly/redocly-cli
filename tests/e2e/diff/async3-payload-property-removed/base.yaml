asyncapi: 3.0.0
info:
  title: asyncapi3-payload-property-removed
  version: '1.0'
channels:
  userSignedUp:
    address: user/signedup
    messages:
      signup:
        contentType: application/json
        payload:
          type: object
          required:
            - id
          properties:
            id:
              type: string
            plan:
              type: string
operations:
  onUserSignedUp:
    action: send
    channel:
      $ref: '#/channels/userSignedUp'
    messages:
      - $ref: '#/channels/userSignedUp/messages/signup'
