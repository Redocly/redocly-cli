openapi: 3.1.0
info:
  title: Redocly Cafe menu
  description: >
    Part of the Redocly Cafe API description. It shares the file of the
    recursive `Problem` schema with the orders description.
  version: 1.0.0
servers:
  - url: https://api.cafe.redocly.com
paths:
  /menu:
    get:
      summary: List all menu items
      operationId: listMenuItems
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: string
      responses:
        '400':
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: ./schemas/problem.yaml
