name: Generate-client harness

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/client-generator/**'
      - 'tests/harness/**'
      - '.github/workflows/harness.yaml'
  workflow_dispatch:

env:
  CI: true
  REDOCLY_TELEMETRY: off

jobs:
  run-harness:
    # Only run if PR is from the same repository (not a fork)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install httpx (the Python import bar needs it)
        run: pip install httpx
      - name: Cache the pinned GitHub REST description
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: tests/harness/.cache
          key: harness-github-description-${{ hashFiles('tests/harness/generate-client/helpers.ts') }}
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run harness
        run: npm run harness
