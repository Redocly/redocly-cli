name: Smoke tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CI: true
  REDOCLY_TELEMETRY: off

jobs:
  run-smoke-push:
    # Only run if PR is from the same repository (not a fork)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pack and install the CLI
        run: |
          npm run pack:prepare
          npm i -g ./redocly-cli.tgz
          redocly --version
      - name: Push to the staging Reunite project
        run: |
          redocly push resources/description.md \
            --organization redocly \
            --project dark-side-push-command-test \
            --mount-path cli-smoke \
            --branch main \
            --author "Redocly CLI Smoke <cli-smoke@redocly.com>" \
            --message "Smoke test push from GitHub run ${{ github.run_id }}" \
            --domain https://app.bhstage.cloud
        env:
          REDOCLY_AUTHORIZATION: ${{ secrets.REDOCLY_PUSH_SMOKE_AUTHORIZATION }}
