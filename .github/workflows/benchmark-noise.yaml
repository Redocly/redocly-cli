name: Benchmark runner noise (temporary)

# TEMPORARY — measures how much the performance benchmark varies between runs on the
# same commit, per runner provider. Every sample runs the exact steps of performance.yaml;
# the report job aggregates the raw hyperfine JSON and comments the result on the PR.
# Re-running the whole workflow adds another batch of samples to the same report.
# Delete this workflow and tests/performance/noise-report.mjs before merging.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

env:
  CI: true
  REDOCLY_TELEMETRY: off

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, blacksmith-4vcpu-ubuntu-2404]
        sample: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm for Rebilly/api-definitions
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
          version: 11.22.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Install External
        run: npm i -g hyperfine

      - name: Prepare
        run: |
          npm run compile
          npm run pack:prepare
          cd tests/performance/
          npm i
          npm run make-test

      - name: Record machine info
        run: |
          mkdir -p noise
          {
            echo "runner=${{ matrix.runner }}"
            echo "sample=${{ matrix.sample }}"
            echo "attempt=${{ github.run_attempt }}"
            echo "nproc=$(nproc)"
            echo "cpu=$(lscpu | grep 'Model name' | sed 's/.*: *//')"
            echo "mem_kb=$(grep MemTotal /proc/meminfo | awk '{print $2}')"
          } | tee noise/meta.txt

      - name: Run Benchmark
        run: |
          cd tests/performance/
          npm run test # Generated by make-test in the previous step.
          cat benchmark_bundle.md benchmark_lint.md benchmark_check-config.md
          cp benchmark_*.json ../../noise/

      - name: Upload raw results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noise-${{ matrix.runner }}-${{ matrix.sample }}-a${{ github.run_attempt }}
          path: noise/

  report:
    needs: sample
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Download all samples (including earlier attempts of this run)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: noise-*
          path: noise-results
      - name: Build report
        run: |
          node tests/performance/noise-report.mjs noise-results | tee noise-report.md
          cat noise-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          file-path: noise-report.md
          comment-tag: benchmark-noise
