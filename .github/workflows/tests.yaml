name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  CI: true
  REDOCLY_TELEMETRY: off

jobs:
  build-and-unit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the generated client-generator files are committed
        run: git diff --exit-code -- packages/client-generator/src/runtime-sources packages/client-generator/eject-assets/skills
      - parallel:
          - name: Typecheck
            run: npm run typecheck
          - name: Unit Tests
            run: npm run unit
          - name: Type Tests
            run: npm run unit:types

      - name: Coverage Report
        if: always() # Also generate the report if tests are failing
        continue-on-error: true # Do not fail if there is an error during reporting
        uses: davelosert/vitest-coverage-report-action@d63aa97db4c0319f304f1787689de1ca548365cf # v2.11.1

  e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: E2E Tests
        run: npm run e2e

  client-generators:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - parallel:
          - name: Install dependencies
            run: npm ci
          - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
            with:
              python-version: '3.12'
          - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
            with:
              go-version: stable
              cache: false
          - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
            with:
              php-version: '8.4'
              coverage: none
              tools: phpstan:2.1.17
          - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
            with:
              distribution: temurin
              java-version: '21'
          - name: Cache the pinned GitHub REST description
            uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
            with:
              path: packages/client-generator/tests/e2e/shared/large-descriptions/.cache
              key: large-descriptions-${{ hashFiles('packages/client-generator/tests/e2e/shared/large-descriptions/large-descriptions.ts') }}
      - name: Install httpx, pydantic, and mypy (the Python bars need them)
        run: pip install httpx pydantic mypy==2.4.0
      - parallel:
          - name: Client generator tests
            run: npm run client-generators
          # The diff fails when a committed example client (zero-install-quickstart) is stale.
          - name: Regenerate, check, and type-check the examples
            # `git status --porcelain` also lists new and deleted files, which `git diff` misses.
            run: npm run examples:regen -w @redocly/client-generator && git status --porcelain -- packages/client-generator/examples | (! grep .) && npm run typecheck:examples -w @redocly/client-generator

  code-style-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
