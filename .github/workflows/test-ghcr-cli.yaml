name: Test GHCR CLI image

# Throwaway workflow for checking how ghcr.io/redocly/cli behaves in CI.
# Delete it once the question is answered.

on:
  pull_request:
    paths:
      - .github/workflows/test-ghcr-cli.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/redocly/cli:2.49.0

jobs:
  # The CLI runs in the container, checkout runs on the host.
  docker-run:
    name: docker run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Version
        run: docker run --rm "$IMAGE" --version

      - name: Lint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/spec" \
            "$IMAGE" \
            lint resources/cafe.yaml --format=github-actions

  # Everything runs in the container, including actions/checkout.
  job-container:
    name: container
    runs-on: ubuntu-latest
    container: ghcr.io/redocly/cli:2.49.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Version
        run: redocly --version

      - name: Lint
        run: redocly lint resources/cafe.yaml --format=github-actions
