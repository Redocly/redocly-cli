<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-label="Redocly Platform: write, review, publish. Start a 30-day free trial.">
          <defs>
            <linearGradient id="addark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#151b2b"/><stop offset="1" stop-color="#1d2c52"/></linearGradient>
            <pattern id="adDotsdark" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".08"/></pattern>
          </defs>
          <rect width="960" height="200" rx="12" fill="url(#addark)"/>
          <rect width="960" height="200" rx="12" fill="url(#adDotsdark)"/>
          <rect x=".5" y=".5" width="959" height="199" rx="12" fill="none" stroke="#2a3550"/>
          <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
            <text x="40" y="58" font-size="13" fill="#8ea3d6" letter-spacing="1.5">REDOCLY PLATFORM</text>
            <text x="40" y="94" font-size="26" font-weight="600" fill="#f0f6fc">Publish what you lint.</text>
            <text x="40" y="122" font-size="14" fill="#b8c4de">Interactive API docs, a mock server, and an API catalog,</text>
            <text x="40" y="141" font-size="14" fill="#b8c4de">published from your Git repository.</text>
            <rect x="40" y="154" width="196" height="32" rx="6" fill="#6e9bff"/>
            <text x="138" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#0d1117">Start a free trial  →</text>
            <g transform="translate(580,44)">
              <rect y="0" width="340" height="40" rx="8" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
              <text x="16" y="25" font-size="14" font-weight="600" fill="#f0f6fc">Platform</text>
              <text x="168" y="25" font-size="13" fill="#b8c4de">write, review, publish</text>
              <rect y="48" width="340" height="40" rx="8" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
              <text x="16" y="73" font-size="14" font-weight="600" fill="#f0f6fc">Framework</text>
              <text x="168" y="73" font-size="13" fill="#b8c4de">docs as code</text>
              <rect y="96" width="340" height="40" rx="8" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
              <text x="16" y="121" font-size="14" font-weight="600" fill="#f0f6fc">Respect Monitoring</text>
              <text x="168" y="121" font-size="13" fill="#b8c4de">checks of live APIs</text>
            </g>
          </g>
        </svg>
