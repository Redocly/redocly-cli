<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="The API lifecycle with Redocly CLI: lint, test, document, generate, compare, and repeat">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11161f"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <pattern id="dotsD" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252c38"/></pattern>
    <marker id="loopD" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6778"/></marker>
    <marker id="stepD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7586"/></marker>
  </defs>
  <rect width="960" height="270" rx="12" fill="url(#bgD)"/>
  <rect width="960" height="270" rx="12" fill="url(#dotsD)"/>
  <rect x=".5" y=".5" width="959" height="269" rx="12" fill="none" stroke="#2a313c"/>
  <path d="M840 90 C 840 28, 120 28, 120 90" fill="none" stroke="#5d6778" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#loopD)"/>
  <rect x="364" y="31" width="232" height="26" rx="13" fill="#151b23" stroke="#2a313c"/>
  <text x="480" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">on every change, locally and in CI</text>
  <line x1="164" y1="130" x2="256" y2="130" stroke="#6b7586" stroke-width="2" marker-end="url(#stepD)"/>
  <line x1="344" y1="130" x2="436" y2="130" stroke="#6b7586" stroke-width="2" marker-end="url(#stepD)"/>
  <line x1="524" y1="130" x2="616" y2="130" stroke="#6b7586" stroke-width="2" marker-end="url(#stepD)"/>
  <line x1="704" y1="130" x2="796" y2="130" stroke="#6b7586" stroke-width="2" marker-end="url(#stepD)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(120,130)">
      <circle r="34" fill="#151b23" stroke="#6e9bff" stroke-width="2"/>
      <path d="M-11 0 L-3 8 L12 -8" fill="none" stroke="#6e9bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" font-size="15" font-weight="600" fill="#f0f6fc">Lint</text>
      <text y="79" font-size="12" fill="#9198a1">your style guide</text>
      <text y="102" font-size="12.5" fill="#6e9bff" font-family="ui-monospace, Menlo, monospace">lint</text>
    </g>
    <g transform="translate(300,130)">
      <circle r="34" fill="#151b23" stroke="#3d444d" stroke-width="2"/>
      <path d="M-5 -13 L-5 -3 L-13 11 Q-14 14 -10 14 L10 14 Q14 14 13 11 L5 -3 L5 -13 M-8 -13 L8 -13 M-9 6 L9 6" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" font-size="15" font-weight="600" fill="#f0f6fc">Test</text>
      <text y="79" font-size="12" fill="#9198a1">the live API</text>
      <text y="102" font-size="12.5" fill="#6e9bff" font-family="ui-monospace, Menlo, monospace">respect</text>
    </g>
    <g transform="translate(480,130)">
      <circle r="34" fill="#151b23" stroke="#3d444d" stroke-width="2"/>
      <path d="M-10 -14 L5 -14 L11 -8 L11 14 L-10 14 Z M-5 -4 L6 -4 M-5 2 L6 2 M-5 8 L2 8" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" font-size="15" font-weight="600" fill="#f0f6fc">Document</text>
      <text y="79" font-size="12" fill="#9198a1">API reference docs</text>
      <text y="102" font-size="12.5" fill="#6e9bff" font-family="ui-monospace, Menlo, monospace">build-docs</text>
    </g>
    <g transform="translate(660,130)">
      <circle r="34" fill="#151b23" stroke="#3d444d" stroke-width="2"/>
      <path d="M-7 -9 L-15 0 L-7 9 M7 -9 L15 0 L7 9 M3 -12 L-3 12" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" font-size="15" font-weight="600" fill="#f0f6fc">Generate</text>
      <text y="79" font-size="12" fill="#9198a1">typed clients</text>
      <text y="102" font-size="12.5" fill="#6e9bff" font-family="ui-monospace, Menlo, monospace">generate-client</text>
    </g>
    <g transform="translate(840,130)">
      <circle r="34" fill="#151b23" stroke="#3d444d" stroke-width="2"/>
      <path d="M-12 -6 L10 -6 M5 -11 L10 -6 L5 -1 M12 6 L-10 6 M-5 1 L-10 6 L-5 11" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="60" font-size="15" font-weight="600" fill="#f0f6fc">Compare</text>
      <text y="79" font-size="12" fill="#9198a1">versions and traffic</text>
      <text y="102" font-size="12.5" fill="#6e9bff" font-family="ui-monospace, Menlo, monospace">diff · drift</text>
    </g>
  </g>
</svg>
